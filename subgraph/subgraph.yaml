specVersion: 0.0.5
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum/contract
    name: RWAFactory
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: RWAFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
        - Asset
        - Proposal
        - Deposit
      abis:
        - name: RWAFactory
          file: ./abis/RWAFactory.json
      eventHandlers:
        - event: AssetDeployed(address,uint256)
          handler: handleAssetDeployed
      file: ./src/mappings.ts

  - kind: ethereum/contract
    name: RWAVault
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: RWAVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Deposit
      abis:
        - name: RWAVault
          file: ./abis/RWAVault.json
      eventHandlers:
        - event: Deposit(address,address,uint256,uint256)
          handler: handleVaultDeposit
      file: ./src/mappings.ts

  - kind: ethereum/contract
    name: ProtocolGovernor
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: ProtocolGovernor
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings.ts
      entities:
        - Proposal
      abis:
        - name: ProtocolGovernor
          file: ./abis/ProtocolGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
