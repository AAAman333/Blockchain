[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24" # МЕНЯЕМ НА 0.8.24
evm_version = "cancun" # Актуально для последних версий Solidity и L2
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/"
]